name: Apply catalog selection print

on:
  push:
    branches:
      - feat/catalogo-selecao-impressao-20260829

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/catalogo-selecao-impressao-20260829
          fetch-depth: 0

      - name: Apply catalog selection workflow
        run: python .github/scripts/apply_catalog_selection.py

      - name: Remove temporary files and commit
        run: |
          rm -f .github/workflows/apply-catalog-selection-print.yml
          rm -f .github/scripts/apply_catalog_selection.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(estoque): add multi-select catalog printing"
          git push origin HEAD:feat/catalogo-selecao-impressao-20260829
