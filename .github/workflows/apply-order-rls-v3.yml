name: Apply order RLS v3 patch

on:
  push:
    branches:
      - agent/gestify-core-v1
    paths:
      - "scripts/maintenance/apply-order-rls-v3.mjs"
      - ".github/workflows/apply-order-rls-v3.yml"

permissions:
  contents: write

concurrency:
  group: apply-order-rls-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, 'security: remove direct authenticated order updates') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/gestify-core-v1
          fetch-depth: 0

      - name: Apply deterministic patch
        run: node scripts/maintenance/apply-order-rls-v3.mjs

      - name: Review changed scope
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "src/app/(dashboard)/dashboard/pedidos/actions.ts" \
            "supabase/migrations/20260803213227_consolidate_order_rls_p0.sql" \
            "scripts/rls/verify-order-cutover.sql" \
            "scripts/maintenance/apply-order-rls-v3.mjs" \
            ".github/workflows/apply-order-rls-v3.yml"
          git commit -m "security: remove direct authenticated order updates"
          git push origin HEAD:agent/gestify-core-v1
