name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Pull-request code must never receive production Supabase credentials.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      FISCAL_SYNC_SECRET: ci_fiscal_sync_placeholder
      GESTIFY_NEW_SIGNUPS_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: QA production guard audit
        run: node scripts/audit-qa-production-guards.mjs

      - name: SECURITY DEFINER RPC audit
        run: node scripts/audit-security-definer-rpcs.mjs

      - name: Proxy/auth resilience contract
        run: node scripts/audit-proxy-auth-resilience.mjs

      - name: Order status contract audit
        run: node scripts/audit-order-status-contract.mjs

      - name: Idempotency and concurrency contract audit
        run: node scripts/audit-idempotency-contract.mjs

      - name: Readiness monitoring and load guard audit
        run: node scripts/audit-ops-readiness-load.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production dependency audit
        run: npm run audit

      - name: Excel export smoke
        run: npm run excel:smoke

      - name: Tenant write audit
        run: npm run tenant:writes:ci

      - name: Production readiness static check
        run: npm run readiness:check

      - name: Deployment readiness check
        run: npm run readiness:deployment

      - name: Build
        run: npm run build

  production-contract:
    name: Production Supabase contract (main only)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require production Supabase contract secrets
        env:
          PROD_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PROD_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$PROD_SUPABASE_URL" ] || [ -z "$PROD_SUPABASE_SECRET_KEY" ]; then
            echo "Production Supabase contract secrets are required on push to main."
            exit 1
          fi

      - name: Supabase contract
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run supabase:contract

      - name: Order RLS/RPC audit
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run orders:rls:ci
