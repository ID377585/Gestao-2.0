name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || 'sb_secret_ci_placeholder' }}
      FISCAL_SYNC_SECRET: ${{ secrets.FISCAL_SYNC_SECRET || 'ci_fiscal_sync_placeholder' }}
      HAS_SUPABASE_CONTRACT_SECRETS: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.SUPABASE_SECRET_KEY != '' }}
      GESTIFY_NEW_SIGNUPS_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production dependency audit
        run: npm run audit

      - name: Tenant write audit
        run: npm run tenant:writes:ci

      - name: Production readiness static check
        run: npm run readiness:check

      - name: Require Supabase contract secrets on main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SUPABASE_CONTRACT_SECRETS != 'true' }}
        run: |
          echo "Supabase contract secrets are required for main."
          echo "Configure NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SECRET_KEY in GitHub Actions secrets."
          exit 1

      - name: Supabase contract
        if: ${{ env.HAS_SUPABASE_CONTRACT_SECRETS == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run supabase:contract

      - name: Order RLS/RPC audit
        if: ${{ env.HAS_SUPABASE_CONTRACT_SECRETS == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run orders:rls:ci

      - name: Build
        run: npm run build
