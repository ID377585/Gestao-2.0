name: Apply catalog mobile photo input fix

on:
  push:
    branches:
      - fix/catalogo-mobile-gallery-20260828
    paths:
      - .github/workflows/fix-catalog-mobile-photo-input.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/catalogo-mobile-gallery-20260828
          fetch-depth: 0

      - name: Apply targeted TypeScript patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path("src/app/(dashboard)/estoque/catalogo/CatalogoClient.tsx")
          text = component.read_text(encoding="utf-8")

          old_refs = '  const fileRef = useRef<HTMLInputElement>(null);\n'
          new_refs = (
              '  const galleryInputRef = useRef<HTMLInputElement>(null);\n'
              '  const cameraInputRef = useRef<HTMLInputElement>(null);\n'
          )

          old_controls = '''                <input ref={fileRef} type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" capture="environment" className="hidden" onChange={choosePhoto} />
                <Button type="button" variant="outline" className="w-full" disabled={processingPhoto || saving} onClick={() => fileRef.current?.click()}><Upload className="h-4 w-4" />{preview ? "Trocar foto" : "Selecionar foto"}</Button>
'''
          new_controls = '''                <input ref={galleryInputRef} type="file" accept="image/*,.heic,.heif" className="hidden" onChange={choosePhoto} />
                <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={choosePhoto} />
                <div className="grid grid-cols-1 gap-2 sm:grid-cols-2">
                  <Button type="button" variant="outline" className="w-full" disabled={processingPhoto || saving} onClick={() => galleryInputRef.current?.click()}><Upload className="h-4 w-4" />{preview ? "Trocar pela galeria" : "Escolher da galeria"}</Button>
                  <Button type="button" variant="outline" className="w-full" disabled={processingPhoto || saving} onClick={() => cameraInputRef.current?.click()}><Camera className="h-4 w-4" />{preview ? "Tirar nova foto" : "Tirar foto"}</Button>
                </div>
'''

          old_help = '                <p className="text-xs leading-5 text-muted-foreground">JPG, PNG, WebP ou HEIC. A foto é otimizada automaticamente.</p>\n'
          new_help = '                <p className="text-xs leading-5 text-muted-foreground">No celular, escolha uma imagem da galeria ou tire uma nova foto. JPG, PNG, WebP ou HEIC; a imagem é otimizada automaticamente.</p>\n'

          replacements = [
              (old_refs, new_refs, "photo input refs"),
              (old_controls, new_controls, "photo controls"),
              (old_help, new_help, "photo help text"),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} block, found {count}.")
              text = text.replace(old, new, 1)

          component.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/fix-catalog-mobile-photo-input.yml")
          workflow.unlink()
          PY

      - name: Commit the fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "src/app/(dashboard)/estoque/catalogo/CatalogoClient.tsx" ".github/workflows/fix-catalog-mobile-photo-input.yml"
          git commit -m "fix(estoque): allow gallery and camera on mobile"
          git push origin HEAD:fix/catalogo-mobile-gallery-20260828
