name: Fix order RLS v3 fallback

on:
  push:
    branches:
      - agent/gestify-core-v1
    paths:
      - "scripts/maintenance/fix-order-rls-v3-fallback.mjs"
      - ".github/workflows/fix-order-rls-v3-fallback.yml"

permissions:
  contents: write

concurrency:
  group: fix-order-rls-v3-fallback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, 'fix: keep legacy order metadata fallback session-scoped') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/gestify-core-v1
          fetch-depth: 0

      - name: Apply deterministic correction
        run: node scripts/maintenance/fix-order-rls-v3-fallback.mjs

      - name: Review changed scope
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "src/app/(dashboard)/dashboard/pedidos/actions.ts" \
            "scripts/maintenance/fix-order-rls-v3-fallback.mjs" \
            ".github/workflows/fix-order-rls-v3-fallback.yml"
          git commit -m "fix: keep legacy order metadata fallback session-scoped"
          git push origin HEAD:agent/gestify-core-v1
