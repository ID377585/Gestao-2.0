name: JS-YAML lock refresh

on:
  push:
    branches:
      - agent/security/dev-dependency-audit-20260825
    paths:
      - package.json
      - .github/workflows/js-yaml-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.repository == 'ID377585/Gestao-2.0' && github.ref == 'refs/heads/agent/security/dev-dependency-audit-20260825'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security/dev-dependency-audit-20260825
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate clean install
        run: npm ci --ignore-scripts
      - name: Validate full audit
        run: npm audit --audit-level=high
      - name: Commit only regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: refresh lock for patched js-yaml"
          git push origin HEAD:agent/security/dev-dependency-audit-20260825
