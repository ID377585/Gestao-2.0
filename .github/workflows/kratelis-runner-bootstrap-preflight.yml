name: Kratelis runner bootstrap preflight

on:
  pull_request:
    paths:
      - ".github/workflows/kratelis-runner-bootstrap-preflight.yml"

permissions:
  contents: read

jobs:
  privilege-preflight:
    runs-on: [self-hosted, linux, x64, gestify-dr]
    timeout-minutes: 5
    steps:
      - name: Inspect Docker isolation capability
        shell: bash
        run: |
          set -euo pipefail
          echo "user=$(id -un)"
          echo "uid=$(id -u)"
          uname -sr
          if sudo -n true 2>/dev/null; then
            echo "passwordless_sudo=yes"
          else
            echo "passwordless_sudo=no"
          fi
          command -v docker >/dev/null
          docker info >/dev/null
          echo "docker_access=yes"
          docker version --format 'server={{.Server.Version}}'
          if docker inspect kratelis-ci-runner >/dev/null 2>&1; then
            echo "kratelis_container_exists=yes"
            exit 2
          fi
          echo "kratelis_container_exists=no"
          if docker volume inspect kratelis-ci-data >/dev/null 2>&1; then
            echo "kratelis_volume_exists=yes"
            exit 3
          fi
          echo "kratelis_volume_exists=no"
          if docker ps --format '{{.Names}}' | grep -qx 'gestify-dr-hostgator'; then
            echo "gestify_dr_container=yes"
          else
            echo "gestify_dr_container=no_or_host_service"
          fi
