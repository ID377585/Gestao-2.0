name: Kratelis runner bootstrap preflight

on:
  pull_request:
    paths:
      - ".github/workflows/kratelis-runner-bootstrap-preflight.yml"

permissions:
  contents: read

jobs:
  privilege-preflight:
    runs-on: [self-hosted, linux, x64, gestify-dr]
    timeout-minutes: 5
    steps:
      - name: Inspect Docker isolation capability
        shell: bash
        run: |
          set -euo pipefail
          echo "user=$(id -un)"
          echo "uid=$(id -u)"
          uname -sr
          command -v docker >/dev/null
          docker info >/dev/null
          echo "docker_access=yes"
          docker version --format 'server={{.Server.Version}}'
          test ! "$(docker inspect -f '{{.Name}}' kratelis-ci-runner 2>/dev/null || true)" || exit 2
          test ! "$(docker volume ls -q --filter name='^kratelis-ci-data$')" || exit 3

      - name: Authorize founder Mac public key for bootstrap SSH
        shell: bash
        env:
          FOUNDER_MAC_PUBKEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFxVQZJWUE4anZdLlhydCAEoFV9VwqKipWsRtxVBRpye gestify-dr-macbook"
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          touch "${HOME}/.ssh/authorized_keys"
          chmod 600 "${HOME}/.ssh/authorized_keys"
          if ! grep -qxF "${FOUNDER_MAC_PUBKEY}" "${HOME}/.ssh/authorized_keys"; then
            printf '%s\n' "${FOUNDER_MAC_PUBKEY}" >> "${HOME}/.ssh/authorized_keys"
          fi
          grep -qxF "${FOUNDER_MAC_PUBKEY}" "${HOME}/.ssh/authorized_keys"
          echo "founder_mac_key_authorized=yes"
