name: M2 staging secret binding check
on:
  push:
    branches:
      - agent/diagnostic/m2-staging-secret-binding-20260917
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Linux, X64, gestify-dr]
    timeout-minutes: 10
    env:
      CHECK_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      CHECK_SECRET: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Verify staging binding without disclosure
        shell: bash
        run: |
          set -euo pipefail
          expected='https://tuncavkhjazruijujatb.supabase.co'
          if [ "${CHECK_URL}" = "${expected}" ]; then echo 'URL_MATCHES_STAGING=true'; else echo 'URL_MATCHES_STAGING=false'; fi
          if [ -n "${CHECK_SECRET:-}" ]; then echo 'SECRET_PRESENT=true'; else echo 'SECRET_PRESENT=false'; exit 1; fi
          code=$(curl -sS -o /tmp/m2-ledger-check.json -w '%{http_code}' "${expected}/rest/v1/gestify_admin_request_log?select=id&limit=1" -H "apikey: ${CHECK_SECRET}" -H "Authorization: Bearer ${CHECK_SECRET}")
          echo "LEDGER_HTTP=${code}"
          [ "${code}" = "200" ]
