name: Order RLS cutover drill

"on":
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20260803213227_consolidate_order_rls_p0.sql"
      - "scripts/rls/**"
      - "docs/operations/order-rls-*.md"
      - ".github/workflows/order-rls-cutover.yml"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260803213227_consolidate_order_rls_p0.sql"
      - "scripts/rls/**"
      - "docs/operations/order-rls-*.md"
      - ".github/workflows/order-rls-cutover.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gestify-order-rls-cutover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cutover-drill:
    name: Two-tenant order RLS cutover
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify container runtime
        run: |
          docker version
          docker info >/dev/null

      - name: Run isolated order RLS cutover drill
        id: cutover
        run: bash scripts/rls/run-order-cutover-drill.sh

      - name: Upload cutover report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gestify-order-rls-cutover-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/order-rls-cutover/order-rls-cutover-report-*.json
          if-no-files-found: ignore
          retention-days: 30
