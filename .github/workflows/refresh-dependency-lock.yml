name: Refresh dependency lock

on:
  push:
    branches:
      - agent/gestify-core-v1
    paths:
      - package.json
      - .github/workflows/refresh-dependency-lock.yml

permissions:
  contents: write

concurrency:
  group: refresh-dependency-lock-agent-gestify-core-v1
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    name: Refresh package-lock without force
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/gestify-core-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove stale packages and refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply non-breaking production audit fixes
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --omit=dev
          audit_fix_status=$?
          set -e
          echo "npm audit fix exit status: ${audit_fix_status}"
          echo "A non-zero status is allowed when vulnerabilities remain without a non-breaking fix."

      - name: Ensure package.json was not rewritten
        run: git diff --exit-code -- package.json

      - name: Verify npm ci accepts the refreshed lockfile
        run: npm ci --ignore-scripts

      - name: Verify Core dependency boundary
        run: npm run core:security:audit

      - name: Report remaining production vulnerabilities
        shell: bash
        run: npm audit --omit=dev --audit-level=high || true

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:agent/gestify-core-v1
