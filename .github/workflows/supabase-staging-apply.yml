name: Supabase staging migration apply

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-staging-apply.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite exatamente apply:gestify-staging:tuncavkhjazruijujatb"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gestify-supabase-staging-apply
  cancel-in-progress: false

jobs:
  staging-apply:
    name: Apply and verify migrations on staging
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging

    env:
      STAGING_PROJECT_ID: ${{ vars.STAGING_PROJECT_ID }}
      PRODUCTION_PROJECT_ID: ${{ vars.PRODUCTION_PROJECT_ID }}
      STAGING_PROJECT_NAME: ${{ vars.STAGING_PROJECT_NAME }}
      STAGING_EXPECTED_REGION: ${{ vars.STAGING_EXPECTED_REGION }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      APPLY_CONFIRMATION: ${{ inputs.confirmation }}
      EVENT_NAME: ${{ github.event_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Validate configuration and explicit target
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            STAGING_PROJECT_ID \
            PRODUCTION_PROJECT_ID \
            STAGING_PROJECT_NAME \
            STAGING_EXPECTED_REGION \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required staging configuration: $name" >&2
              exit 1
            fi
          done

          if [[ "$STAGING_PROJECT_ID" == "$PRODUCTION_PROJECT_ID" ]]; then
            echo "Refusing to run: staging project matches Production." >&2
            exit 1
          fi

          expected="apply:${STAGING_PROJECT_NAME}:${STAGING_PROJECT_ID}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$APPLY_CONFIRMATION" != "$expected" ]]; then
            echo "Invalid apply confirmation." >&2
            echo "Expected: $expected" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$EVENT_NAME" != "push" ]]; then
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

      - name: Verify target project identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/supabase-staging-apply
          inventory="$(mktemp)"
          trap 'rm -f "$inventory"' EXIT

          supabase projects list --output json > "$inventory"

          PROJECTS_JSON="$inventory" node <<'NODE'
          const fs = require('node:fs');

          const projects = JSON.parse(fs.readFileSync(process.env.PROJECTS_JSON, 'utf8'));
          const stagingId = process.env.STAGING_PROJECT_ID;
          const productionId = process.env.PRODUCTION_PROJECT_ID;
          const expectedName = process.env.STAGING_PROJECT_NAME;
          const expectedRegion = process.env.STAGING_EXPECTED_REGION;

          if (!Array.isArray(projects)) throw new Error('Unexpected Supabase project inventory format.');

          const target = projects.find((project) =>
            [project.id, project.ref, project.project_ref].includes(stagingId)
          );
          if (!target) throw new Error('Configured staging project is not accessible to this token.');

          const targetId = target.id ?? target.ref ?? target.project_ref;
          const targetName = target.name ?? '';
          const targetRegion = target.region ?? target.region_code ?? '';

          if (targetId === productionId) throw new Error('Refusing to run: resolved target is Production.');
          if (targetName !== expectedName) throw new Error(`Staging name mismatch: expected ${expectedName}, got ${targetName || '<empty>'}.`);
          if (targetRegion !== expectedRegion) throw new Error(`Staging region mismatch: expected ${expectedRegion}, got ${targetRegion || '<empty>'}.`);

          fs.writeFileSync(
            '.artifacts/supabase-staging-apply/target-validation.json',
            `${JSON.stringify({
              ok: true,
              project_id: targetId,
              project_name: targetName,
              region: targetRegion,
              production_project_is_different: true,
            }, null, 2)}\n`,
            'utf8'
          );
          NODE

      - name: Link staging project
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$STAGING_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Repeat dry-run immediately before apply
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run --include-all 2>&1 \
            | tee .artifacts/supabase-staging-apply/pre-apply-dry-run.log

      - name: Validate one-time historical catch-up allowlist
        shell: bash
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          trap 'rm -f "$expected" "$actual"' EXIT

          cat > "$expected" <<'EOF'
          20260825045423_harden_nutrition_notification_rpc.sql
          20260828214500_harden_inventory_catalog_module_access.sql
          20260828215348_create_inventory_catalog_remote_history_marker.sql
          20260828215401_index_inventory_catalog_audit_users_remote_history_marker.sql
          20260828215411_harden_inventory_catalog_module_access_remote_history_marker.sql
          20260902133545_production_history_marker_create_auth_compliance_ledgers.sql
          20260902133555_production_history_marker_harden_auth_compliance_append_only_grants.sql
          20260909205900_prepare_legal_document_ledgers.sql
          20260909210000_legal_compliance_v2_foundation.sql
          20260909211500_harden_legal_compliance_ledgers.sql
          20260910050000_align_order_rls_audit_with_private_impl.sql
          20260910135000_publish_terms_v2_1.sql
          20260911041508_architecture_fk_indexes_production_history_marker.sql
          20260911050000_architecture_fk_indexes.sql
          20260911060000_reconcile_manage_establishment_helper.sql
          20260911061000_architecture_rls_policy_consolidation_final.sql
          20260911062000_architecture_rls_policy_consolidation_remaining.sql
          20260911113826_architecture_manage_establishment_helper_production_history_marker.sql
          20260911113904_architecture_rls_policy_consolidation_final_production_history_marker.sql
          20260911113916_architecture_user_module_permissions_select_initplan_production_history_marker.sql
          20260911114028_architecture_rls_policy_consolidation_remaining_production_history_marker.sql
          20260911124000_storage_tenant_hardening.sql
          20260911124448_storage_tenant_hardening_production_history_marker.sql
          20260911125302_realtime_order_publication_production_history_marker.sql
          20260911130000_realtime_order_publication_alignment.sql
          20260911134139_publish_terms_v2_1_reconcile.sql
          20260912045052_harden_app_job_queue_leases_remote_history_marker.sql
          20260912045242_public_demo_leads_and_rpc_execute_hardening.sql
          20260912045536_restrict_legacy_sql_executor_remote_history_marker.sql
          EOF

          sed -i 's/^          //' "$expected"
          sort -u "$expected" -o "$expected"

          grep -oE '[0-9]{14}_[A-Za-z0-9_]+\.sql' \
            .artifacts/supabase-staging-apply/pre-apply-dry-run.log \
            | sort -u > "$actual" || true

          if [[ ! -s "$actual" ]]; then
            echo "Dry-run did not expose an auditable migration list; refusing historical catch-up." >&2
            exit 1
          fi

          if ! diff -u "$expected" "$actual"; then
            echo "Historical catch-up set changed; refusing apply." >&2
            exit 1
          fi

          cp "$actual" .artifacts/supabase-staging-apply/historical-catchup-allowlist.txt

      - name: Apply migrations to staging only
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --include-all 2>&1 \
            | tee .artifacts/supabase-staging-apply/apply.log

      - name: Verify migration state and database lint
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked 2>&1 \
            | tee .artifacts/supabase-staging-apply/migration-list.log
          supabase db lint --linked --level error --fail-on error 2>&1 \
            | tee .artifacts/supabase-staging-apply/db-lint.log

      - name: Upload apply evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gestify-supabase-staging-apply-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/supabase-staging-apply/**
          if-no-files-found: warn
          retention-days: 30
