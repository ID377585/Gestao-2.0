name: Supabase staging contract

"on":
  workflow_dispatch:
    inputs:
      action:
        description: "Ação remota: plan, verify ou apply"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - verify
          - apply
      confirmation:
        description: "Para apply: apply:gestify-staging:<STAGING_PROJECT_ID>"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gestify-supabase-staging
  cancel-in-progress: false

jobs:
  staging-contract:
    name: Plan, apply or verify staging migrations
    if: >-
      ${{ github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/agent/gestify-core-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: staging

    env:
      TARGET_ENVIRONMENT: staging
      GITHUB_ENVIRONMENT: staging
      STAGING_PROJECT_ID: ${{ vars.STAGING_PROJECT_ID }}
      PRODUCTION_PROJECT_ID: ${{ vars.PRODUCTION_PROJECT_ID }}
      STAGING_PROJECT_NAME: ${{ vars.STAGING_PROJECT_NAME }}
      STAGING_EXPECTED_REGION: ${{ vars.STAGING_EXPECTED_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Verify tools and staging confirmation
        env:
          STAGING_ACTION: ${{ inputs.action }}
          STAGING_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node --version
          npm --version
          supabase --version

          if [[ "$STAGING_ACTION" == "apply" ]]; then
            project_name="${STAGING_PROJECT_NAME:-gestify-staging}"
            expected="apply:${project_name}:${STAGING_PROJECT_ID}"

            if [[ "$STAGING_CONFIRMATION" != "$expected" ]]; then
              echo "Confirmação inválida para apply." >&2
              echo "Use exatamente: $expected" >&2
              exit 1
            fi
          fi

      - name: Re-run clean migration bootstrap before remote plan/apply
        if: ${{ inputs.action != 'verify' }}
        run: |
          docker version
          docker info >/dev/null
          bash scripts/supabase/run-full-migration-smoke.sh

      - name: Run protected staging contract
        env:
          STAGING_ACTION: ${{ inputs.action }}
          STAGING_CONFIRMATION: ${{ inputs.confirmation }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          bash scripts/supabase/run-staging-contract.sh \
            "$STAGING_ACTION" \
            "$STAGING_CONFIRMATION"

      - name: Upload staging evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gestify-supabase-staging-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/supabase-staging/**
            .artifacts/supabase-migration-smoke/**
          if-no-files-found: warn
          retention-days: 30
